name: 'Publish Docs'

permissions:
  contents: write
  pages: write
  id-token: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-docs:
    name: Publish docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npx nx run docs:build --minify=false --outputPath=dist/docs

      - name: Build storybook
        run: npx nx run storybook:build:ci

      # Reads the reports visual-report.yml publishes, see
      # tools/visual-report/README.md
      - name: Build visual regression report viewer
        run: |
          npx nx run visual-report-viewer:build
          cp -r dist/apps/visual-report-viewer dist/docs/visual-report

      - name: Deploy website and storybook
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/docs
          branch: gh-pages
          clean-exclude: |
            pr-preview
          force: false
