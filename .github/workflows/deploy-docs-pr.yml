name: 'Deploy Docs (PR)'

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write
  pages: write # to deploy to Pages
  id-token: write # to verify the deployment originates from an appropriate source

env:
  PR_NUMBER: ${{ github.event.number }}

concurrency: preview-${{ github.ref }}

jobs:
  deploy-preview:
    if: >-
      !(
         startsWith(github.head_ref, 'ops/') ||
         startsWith(github.head_ref, 'chore/')
       )
    name: Build Docusaurus and Storybook and deploy PR preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, test and build website
        run: npx nx run-many -t lint,test,build --projects=docs

      - name: Build storybook
        run: npx nx run storybook:build:ci --skip-nx-cache

      # Reads the reports visual-report.yml publishes, see
      # tools/visual-report/README.md
      - name: Build visual regression report viewer
        run: |
          npx nx run visual-report-viewer:build
          cp -r dist/apps/visual-report-viewer dist/docs/visual-report

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist/docs
          pages-base-url: 'designsystem.migrationsverket.se'
