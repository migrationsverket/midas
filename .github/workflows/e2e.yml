name: 'e2e'

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main

permissions:
  contents: read

jobs:
  playwright-version:
    name: Resolve Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false

      - name: Read version from package-lock.json
        id: version
        run: echo "version=$(jq -r '.packages["node_modules/playwright"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E registry tests
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Playwright image has the browsers and their system dependencies,
    # which `playwright install --with-deps` fetched from a slow Ubuntu mirror
    # when several jobs started at once. See the test job in pr-checks.yml
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001 --ipc=host --init
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Verdaccio
        run: npx verdaccio --config .verdaccio/config.yaml --listen 4873 &

      - name: Publish packages to local registry
        run: npx nx run @midas-ds/source:release:local --skipVerdaccioStart

      - name: Install from registry
        run: npm install --prefix apps/next --@midas-ds:registry=http://localhost:4873/

      - name: Remove dist files
        run: rm -rf dist

      - name: Build Next.js app
        run: npx nx build next

      - name: Build and test e2e project
        run: npx nx e2e next
        env:
          E2E_REGISTRY: true
