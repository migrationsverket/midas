name: 'PR Checks'

on:
  pull_request:
    types:
      - opened
      - labeled
      - reopened
      - synchronize
    branches:
      - main

env:
  # This will be default in nx24
  NX_LEGACY_AFFECTED: 'false'

permissions:
  contents: read

jobs:
  build:
    name: Lint, test and build packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v5

      # The browsers are part of the key: e2e.yml caches a different set, and
      # sharing one key made the browsers available here depend on which
      # workflow happened to save the cache first.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 60000

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build packages
        run: npx nx affected -t lint stylelint build

      - name: Check bundled dependencies are declared
        run: node tools/check-bundled-dependencies/index.mjs

      - name: Check shared-singleton modules stay externalized
        run: node tools/check-bundled-dependencies/check-shared-singletons.mjs

      - name: Test packages
        run: npx nx affected -t test

      - name: A11y check packages
        if: >
          (github.event.action == 'labeled' && github.event.label && github.event.label.name == 'a11y') ||
           contains(github.event.pull_request.labels.*.name, 'a11y')
        run: npx nx affected -t a11y a11y-dark-mode a11y-forced-colors

  lucide-min:
    name: lucide-react 0.x compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The packages declare lucide-react `^0.563.0 || ^1.0.0`, but the repo
      # develops against 1.x, which has icons that 0.x doesn't. Typecheck the
      # packages against the lowest supported version, read from that range.
      - name: Install the lowest supported lucide-react
        run: |
          MIN=$(node -p "require('./packages/components/package.json').dependencies['lucide-react'].match(/\d+\.\d+\.\d+/)[0]")
          echo "Typechecking against lucide-react $MIN"
          npm install --no-save --no-audit --no-fund lucide-react@$MIN

      # Only the packages: the apps use the repo's 1.x
      - name: Typecheck packages
        run: npx nx run-many -t typecheck -p components layout table-styles --skip-nx-cache

  playwright-version:
    name: Resolve Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false

      # The visual job runs in the Playwright image matching the installed
      # version, so screenshots render the same as when the baselines were
      # taken (see update-visual-baseline.yml)
      - name: Read version from package-lock.json
        id: version
        run: echo "version=$(jq -r '.packages["node_modules/playwright"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

  visual:
    name: Visual regression
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    steps:
      # actions/checkout falls back to a plain download without git, which
      # breaks `nx affected` and committing
      - name: Install git
        run: command -v git || (apt-get update && apt-get install -y --no-install-recommends git)

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      # The workspace is owned by another user than the container's
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v5

      # Writes dist/visual-report/<project>/ via tools/visual-report/reporter.mjs
      - name: Visual regression tests
        run: npx nx affected -t visual

      # Picked up by visual-report.yml, which has the permissions to publish
      # the report and comment on the PR (this run may come from a fork)
      - name: Add PR number to report
        if: ${{ !cancelled() }}
        run: |
          mkdir -p dist/visual-report
          echo "${{ github.event.pull_request.number }}" > dist/visual-report/pr-number.txt

      - name: Upload report data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: dist/visual-report/
          retention-days: 14
